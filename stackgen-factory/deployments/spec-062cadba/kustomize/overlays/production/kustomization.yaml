apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payments-production
resources:
  - ../../base
replicas:
  - name: demoapp
    count: 2
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      factory.team: payments
      factory.spec: spec-062cadba
      factory.blueprint: test-hello
patches:
  - target:
      kind: Deployment
      name: demoapp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
